[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-ai-intelligence"
version = "0.1.0"
description = "Organization-Aware, Demand-Driven Shared AI Intelligence – research backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Settings / validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "greenlet>=3.0.0",
    # Qdrant
    "qdrant-client>=1.11.0",
    # HTTP client
    "httpx>=0.27.0",
    # AI providers
    "google-generativeai>=0.8.0",
    # Analysis
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.2.0",
    "tenacity>=8.3.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "ipython>=8.25.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "analysis*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "analysis", "tests"]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "C4", "SIM"]
ignore = [
    "S101",
    "ANN401",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require running services (postgres, qdrant)",
    "unit: marks unit tests that run without external services",
]
